name: Tests

on:
  # Pull requests run once (pull_request); a push runs only on main, after the merge.
  push:
    branches: [main]
  pull_request:

# A newer commit on a pull request replaces the run in progress. A push to main gets a group of its own, so it is never
# cancelled or left waiting: each run compares only its own push, and a docs push right after a code push would
# otherwise cancel the only run that tests the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether anything but docs, Markdown and the release plumbing changed. When nothing did, the test jobs skip and
  # "Tests passed" still reports (a required check must report, so no paths-ignore on the workflow). Anything not on
  # the list counts as code, so a new kind of file runs the tests.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      # Two commits are enough: a pull request is checked out as its merge commit, whose first parent is the base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The merge commit against main as it is now: exactly what merging would change, wherever the branch started
            # (the event's base.sha can be older than the main the merge commit was made with).
            base=""
            if git rev-parse -q --verify "HEAD^2" >/dev/null; then base="HEAD^1"; fi
          else
            # A push to main: everything since the commit main pointed at before, fetched on its own (no history needed).
            base="$BEFORE"
            if [ -n "$base" ]; then git fetch --quiet --no-tags --depth=1 origin "$base" 2>/dev/null || true; fi
          fi
          # No base to compare with (a new branch, a force push that dropped it): run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare with: the tests run."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a file moved onto the list (src/Foo.php to docs/foo.md) still shows its old path.
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed since $(git rev-parse --short "$base"):"; cat "$RUNNER_TEMP/changed.txt"
          skip='^(docs/|art/|.*\.md$|\.github/((release|dependabot|FUNDING)\.yml$|ISSUE_TEMPLATE/|workflows/(release|github-release|docs-sync|add-to-project|dependabot-auto-merge|fix-php-code-style-issues|package-health)\.yml$))'
          # tests/Feature/DistArchiveTest.php lists what ships, root Markdown files included: one added or removed
          # at the root runs the tests (an edit does not).
          if grep -qvE "$skip" "$RUNNER_TEMP/changed.txt" \
            || git diff --name-only --no-renames --diff-filter=AD "$base" HEAD | grep -qE '^[^/]+\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, Markdown or release plumbing changed: the tests skip."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        include:
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"
        exclude:
          - php: "8.3"
            laravel: "13.*"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

  mysql:
    name: Tests (MySQL 8)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: filament_flow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: filament_flow_test
          DB_USERNAME: root
          DB_PASSWORD: ""

  static-analysis:
    name: PHPStan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Analyse
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  canvas:
    name: Canvas (svelte-check, vitest, Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Type-check the Svelte sources
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build the bundle
        run: bun run build

      - name: The committed bundle is up to date
        run: git diff --exit-code --stat -- resources/dist

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # The engine behind Ask AI (PHP 8.4, so a dev dependency only here): the workbench registers it when present
      # and the smoke test then covers the real node, its AI group and a dry run.
      - name: Install packstub/agents for the Ask AI test
        run: composer require packstub/agents --dev --no-interaction --no-progress

      - name: Install Playwright's browser
        run: bunx playwright install --with-deps chromium

      - name: Publish the panel assets
        run: vendor/bin/testbench filament:assets

      - name: Smoke test the canvas in a browser
        run: bun run test:e2e
        env:
          CI: "1"

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # The one check the main branch requires (Settings → Rules): green only when every job above is.
  # A new job goes in `needs`, so the required name stays the same when the matrix changes.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [changes, tests, mysql, static-analysis, canvas]
    runs-on: ubuntu-latest

    steps:
      # Every job succeeded, or the test jobs skipped because only docs changed (never skipped for another reason).
      - name: Fail unless every job succeeded or skipped for docs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Job results: $RESULTS (code changed: $CODE)"
          [ "$CHANGES" = "success" ] || exit 1
          for result in $RESULTS; do
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CODE" = "false" ]; then continue; fi
            exit 1
          done
